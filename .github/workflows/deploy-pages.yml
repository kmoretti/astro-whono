name: deploy-pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  SITE_URL: ${{ vars.SITE_URL }}
  ASTRO_WHONO_BASE_PATH: ${{ vars.ASTRO_WHONO_BASE_PATH || '/' }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify workspace
        working-directory: ${{ github.workspace }}
        run: |
          test -f package.json
          test -f pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: pnpm install --frozen-lockfile

      - name: Build site
        working-directory: ${{ github.workspace }}
        run: pnpm build

      - name: Ensure Cloudflare Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          if pnpm dlx wrangler@latest pages project list | grep -Eq "^[[:space:]]*${CLOUDFLARE_PAGES_PROJECT_NAME}[[:space:]]"; then
            echo "Cloudflare Pages project already exists"
          else
            pnpm dlx wrangler@latest pages project create "${CLOUDFLARE_PAGES_PROJECT_NAME}"
          fi

      - name: Deploy to Cloudflare Pages
        working-directory: ${{ github.workspace }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm dlx wrangler@latest pages deploy dist \
            --project-name="${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}" \
            --branch=main
