name: deploy-pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  SITE_URL: ${{ vars.SITE_URL }}
  ASTRO_WHONO_BASE_PATH: ${{ vars.ASTRO_WHONO_BASE_PATH || '/' }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: ${{ github.workspace }}/.nvmrc
          cache: npm
          cache-dependency-path: ${{ github.workspace }}/package-lock.json

      - name: Verify workspace
        working-directory: ${{ github.workspace }}
        run: |
          test -f package.json
          test -f package-lock.json

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: npm ci --prefix "$GITHUB_WORKSPACE"

      - name: Build site
        working-directory: ${{ github.workspace }}
        run: npm run --prefix "$GITHUB_WORKSPACE" build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ github.workspace }}/dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }} --branch=main
