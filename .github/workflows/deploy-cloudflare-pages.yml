name: Deploy Astro to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

env:
  NODE_VERSION: '22.22.0'
  PNPM_VERSION: '10.30.3'
  PROJECT_DIR: blog
  OUTPUT_DIR: blog/dist

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.SITE_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: blog/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: pnpm install --frozen-lockfile

      - name: Build static site
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          ASTRO_WHONO_BASE_PATH: ${{ vars.ASTRO_WHONO_BASE_PATH }}
        run: pnpm run build

      - name: Verify production artifacts
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: pnpm run check:prod-artifacts

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          directory: ${{ env.OUTPUT_DIR }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
